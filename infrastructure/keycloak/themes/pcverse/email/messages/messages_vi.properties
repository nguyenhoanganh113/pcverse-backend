emailVerificationSubject=[PC-Verse] Xác thực email của bạn
emailVerificationBody=Chào mừng bạn đến với PC-Verse. Hãy mở liên kết dưới đây để xác thực địa chỉ email.\n\n{0}\n\nLiên kết này sẽ hết hạn trong {3}.\n\nNếu bạn không tạo tài khoản này, bạn có thể bỏ qua email.
emailVerificationBodyHtml=<p>Chào mừng bạn đến với <strong>PC-Verse</strong>.</p><p>Hãy xác thực địa chỉ email để hoàn tất thiết lập tài khoản.</p><p><a href="{0}">Xác thực địa chỉ email</a></p><p>Liên kết bảo mật này sẽ hết hạn trong <strong>{3}</strong>.</p><p>Nếu bạn không tạo tài khoản này, bạn có thể bỏ qua email.</p>
passwordResetSubject=[PC-Verse] Đặt lại mật khẩu
passwordResetBody=Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản PC-Verse của bạn.\n\n{0}\n\nLiên kết này sẽ hết hạn trong {3}.\n\nNếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email và mật khẩu hiện tại sẽ không thay đổi.
passwordResetBodyHtml=<p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản <strong>PC-Verse</strong> của bạn.</p><p><a href="{0}">Tạo mật khẩu mới</a></p><p>Liên kết bảo mật này sẽ hết hạn trong <strong>{3}</strong>.</p><p>Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email và mật khẩu hiện tại sẽ không thay đổi.</p>
executeActionsSubject=[PC-Verse] Tài khoản của bạn cần được cập nhật
executeActionsBody=Tài khoản PC-Verse của bạn cần thực hiện các hành động sau: {3}.\n\n{0}\n\nLiên kết này sẽ hết hạn trong {4}.\n\nNếu bạn không chờ đợi yêu cầu này, hãy bỏ qua email.
executeActionsBodyHtml=<p>Tài khoản <strong>PC-Verse</strong> của bạn cần thực hiện các hành động sau: <strong>{3}</strong>.</p><p><a href="{0}">Kiểm tra yêu cầu tài khoản</a></p><p>Liên kết bảo mật này sẽ hết hạn trong <strong>{4}</strong>.</p><p>Nếu bạn không chờ đợi yêu cầu này, hãy bỏ qua email.</p>
