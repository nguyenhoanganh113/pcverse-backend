services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=pc_verse'
      - 'POSTGRES_PASSWORD=123456'
      - 'POSTGRES_USER=postgres'
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pc_verse}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: pc-verse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis
    networks:
      - app_network

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.0}
    container_name: pc-verse-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak} # 5432 là port default của postgre, keycloak chính là POSTGRES_DB
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak} # username và password khi config keycloak_db ở dưới
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak123}

      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8090}
      KC_HTTP_PORT: 8180 # cổng Keycloak thật sự lắng nghe bên trong container. Mặc định là 8080

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "${KEYCLOAK_PORT:-8090}:8180"
    networks:
      - app_network

  keycloak-db:
    image: 'postgres:16-alpine'
    container_name: pc-verse-keycloak-db
    labels:
      org.springframework.boot.ignore: true
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak123}
    ports:
      - "5434:5432"
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pc-verse-backend:latest
    container_name: pc-verse-backend-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pc_verse}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/pcverse}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/pcverse/protocol/openid-connect/certs
      KEYCLOAK_RESOURCE_CLIENT_ID: ${KEYCLOAK_RESOURCE_CLIENT_ID:-pc-verse-api}

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${APP_PORT}:${SERVER_PORT}"
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  keycloak_db_data:

networks:
  app_network:
