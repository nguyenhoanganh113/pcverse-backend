spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: pc-verse

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pc_verse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  access-token:
    private-key: ${JWT_ACCESS_PRIVATE_KEY_BASE64}
    public-key: ${JWT_ACCESS_PUBLIC_KEY_BASE64}
  refresh-token:
    secret-key: ${JWT_REFRESH_SECRET_KEY}

server:
  port: ${SERVER_PORT:8085}
