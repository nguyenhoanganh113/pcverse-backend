<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title description">
  <title id="title">Keycloak UPDATE_PASSWORD Application Initiated Action</title>
  <desc id="description">Sơ đồ tuần tự đổi mật khẩu: người dùng khởi tạo hành động từ frontend, Keycloak xác thực lại và cập nhật credential, sau đó trả authorization code để frontend lấy token mới. Backend không nhận mật khẩu.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d1d5db"/>
    </marker>
    <style>
      .background { fill: #141414; }
      .actor { fill: #2b2b2b; stroke: #a3a3a3; stroke-width: 1.5; rx: 6; }
      .actor-label { fill: #f5f5f5; font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .lane { stroke: #737373; stroke-width: 1; stroke-dasharray: 5 6; }
      .message { stroke: #d1d5db; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .response { stroke: #9ca3af; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .message-label { fill: #f5f5f5; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .step { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.5; rx: 7; }
      .step-text { fill: #f5f5f5; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .note { fill: #292524; stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 7; }
      .note-title { fill: #fde68a; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .note-text { fill: #e5e7eb; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="background" width="1280" height="1030"/>

  <g aria-label="Participants">
    <rect class="actor" x="30" y="24" width="180" height="54"/>
    <text class="actor-label" x="120" y="57">User</text>

    <rect class="actor" x="290" y="24" width="180" height="54"/>
    <text class="actor-label" x="380" y="57">Frontend</text>

    <rect class="actor" x="650" y="24" width="180" height="54"/>
    <text class="actor-label" x="740" y="57">Keycloak</text>

    <rect class="actor" x="1030" y="24" width="180" height="54"/>
    <text class="actor-label" x="1120" y="57">Backend</text>

    <line class="lane" x1="120" y1="78" x2="120" y2="992"/>
    <line class="lane" x1="380" y1="78" x2="380" y2="992"/>
    <line class="lane" x1="740" y1="78" x2="740" y2="992"/>
    <line class="lane" x1="1120" y1="78" x2="1120" y2="992"/>
  </g>

  <g aria-label="Password update sequence">
    <text class="message-label" x="250" y="126">1. Bấm “Đổi mật khẩu”</text>
    <line class="message" x1="120" y1="142" x2="376" y2="142"/>

    <text class="message-label" x="560" y="188">2. Authorization Code + PKCE + kc_action=UPDATE_PASSWORD</text>
    <line class="message" x1="380" y1="204" x2="736" y2="204"/>

    <rect class="step" x="590" y="238" width="300" height="60"/>
    <text class="step-text" x="740" y="263">3. Kiểm tra SSO và thời điểm xác thực</text>
    <text class="step-text" x="740" y="284">Maximum Authentication Age</text>

    <rect class="note" x="990" y="246" width="260" height="82"/>
    <text class="note-title" x="1120" y="270">Backend đứng ngoài luồng credential</text>
    <text class="note-text" x="1120" y="294">Không nhận current password</text>
    <text class="note-text" x="1120" y="314">Không nhận new password</text>

    <text class="message-label" x="430" y="350">4. Yêu cầu xác thực lại (Maximum Age = 0)</text>
    <line class="response" x1="740" y1="366" x2="124" y2="366"/>

    <text class="message-label" x="430" y="412">5. Đăng nhập lại</text>
    <line class="message" x1="120" y1="428" x2="736" y2="428"/>

    <text class="message-label" x="430" y="474">6. Hiển thị form nhập mật khẩu mới</text>
    <line class="response" x1="740" y1="490" x2="124" y2="490"/>

    <text class="message-label" x="430" y="536">7. Gửi mật khẩu mới và xác nhận</text>
    <line class="message" x1="120" y1="552" x2="736" y2="552"/>

    <rect class="step" x="590" y="584" width="300" height="60"/>
    <text class="step-text" x="740" y="609">8. Kiểm tra password policy</text>
    <text class="step-text" x="740" y="630">và password history</text>

    <rect class="step" x="590" y="674" width="300" height="60"/>
    <text class="step-text" x="740" y="699">9. Cập nhật credential</text>
    <text class="step-text" x="740" y="720">trong Keycloak DB</text>

    <text class="message-label" x="560" y="766">10. Redirect callback + authorization code</text>
    <line class="response" x1="740" y1="782" x2="384" y2="782"/>

    <text class="message-label" x="560" y="828">11. keycloak-js đổi code + code_verifier lấy token mới</text>
    <line class="message" x1="380" y1="844" x2="736" y2="844"/>

    <text class="message-label" x="750" y="890">12. Request API với access token</text>
    <line class="message" x1="380" y1="906" x2="1116" y2="906"/>

    <rect class="note" x="990" y="934" width="260" height="58"/>
    <text class="note-title" x="1120" y="958">Mật khẩu chỉ tồn tại ở Keycloak</text>
    <text class="note-text" x="1120" y="980">PCVerse backend không lưu credential</text>
  </g>
</svg>
