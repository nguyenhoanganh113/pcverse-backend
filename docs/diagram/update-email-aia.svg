<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="1380"
     viewBox="0 0 1600 1380"
     role="img"
     aria-labelledby="email-title email-description">
    <title id="email-title">Keycloak UPDATE_EMAIL Application Initiated Action</title>
    <desc id="email-description">
        Sơ đồ tuần tự đổi email: người dùng khởi tạo hành động từ frontend,
        Keycloak xác thực lại khi cần, xác minh địa chỉ email mới, trả authorization
        code để frontend lấy token mới và backend đồng bộ email vào cơ sở dữ liệu.
    </desc>

    <defs>
        <marker id="email-arrow"
                markerWidth="10"
                markerHeight="10"
                refX="9"
                refY="3"
                orient="auto"
                markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#d1d5db"/>
        </marker>
        <style>
            .background {
                fill: #141414;
            }

            .actor {
                fill: #2b2b2b;
                stroke: #a3a3a3;
                stroke-width: 1.5;
            }

            .actor-label {
                fill: #f5f5f5;
                font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-anchor: middle;
            }

            .lane {
                stroke: #737373;
                stroke-width: 1;
                stroke-dasharray: 5 6;
            }

            .message {
                stroke: #d1d5db;
                stroke-width: 1.8;
                fill: none;
                marker-end: url(#email-arrow);
            }

            .response {
                stroke: #9ca3af;
                stroke-width: 1.8;
                stroke-dasharray: 6 5;
                fill: none;
                marker-end: url(#email-arrow);
            }

            .message-label {
                fill: #f5f5f5;
                font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-anchor: middle;
            }

            .step {
                fill: #1f2937;
                stroke: #60a5fa;
                stroke-width: 1.5;
            }

            .step-text {
                fill: #f5f5f5;
                font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-anchor: middle;
            }

            .decision {
                fill: #292524;
                stroke: #fbbf24;
                stroke-width: 1.5;
            }

            .decision-title {
                fill: #fde68a;
                font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-anchor: middle;
            }

            .decision-text {
                fill: #e5e7eb;
                font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-anchor: middle;
            }

            .branch {
                fill: none;
                stroke: #737373;
                stroke-width: 1;
                stroke-dasharray: 5 5;
            }

            .branch-label {
                fill: #d1d5db;
                font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
        </style>
    </defs>

    <rect class="background" width="1600" height="1380"/>

    <g aria-label="Participants">
        <rect class="actor" x="20" y="24" width="160" height="54" rx="6"/>
        <text class="actor-label" x="100" y="57">User</text>

        <rect class="actor" x="290" y="24" width="160" height="54" rx="6"/>
        <text class="actor-label" x="370" y="57">Frontend</text>

        <rect class="actor" x="680" y="24" width="160" height="54" rx="6"/>
        <text class="actor-label" x="760" y="57">Keycloak</text>

        <rect class="actor" x="1000" y="24" width="160" height="54" rx="6"/>
        <text class="actor-label" x="1080" y="57">Email provider</text>

        <rect class="actor" x="1310" y="24" width="160" height="54" rx="6"/>
        <text class="actor-label" x="1390" y="57">Backend</text>

        <line class="lane" x1="100" y1="78" x2="100" y2="1340"/>
        <line class="lane" x1="370" y1="78" x2="370" y2="1340"/>
        <line class="lane" x1="760" y1="78" x2="760" y2="1340"/>
        <line class="lane" x1="1080" y1="78" x2="1080" y2="1340"/>
        <line class="lane" x1="1390" y1="78" x2="1390" y2="1340"/>
    </g>

    <g aria-label="Email update sequence">
        <text class="message-label" x="235" y="126">1. Bấm “Thay đổi email”</text>
        <line class="message" x1="100" y1="142" x2="366" y2="142"/>

        <text class="message-label" x="565" y="188">
            2. Authorization Code + PKCE + kc_action=UPDATE_EMAIL
        </text>
        <line class="message" x1="370" y1="204" x2="756" y2="204"/>

        <rect class="step" x="590" y="238" width="340" height="60" rx="7"/>
        <text class="step-text" x="760" y="263">
            3. Kiểm tra SSO và thời điểm xác thực
        </text>
        <text class="step-text" x="760" y="284">Maximum Authentication Age</text>

        <text class="message-label" x="430" y="342">
            4. Có thể yêu cầu xác thực lại
        </text>
        <line class="response" x1="760" y1="358" x2="104" y2="358"/>

        <text class="message-label" x="430" y="404">
            5. Đăng nhập lại khi được yêu cầu
        </text>
        <line class="message" x1="100" y1="420" x2="756" y2="420"/>

        <text class="message-label" x="430" y="466">
            6. Hiển thị form nhập email mới
        </text>
        <line class="response" x1="760" y1="482" x2="104" y2="482"/>

        <text class="message-label" x="430" y="528">7. Gửi email mới</text>
        <line class="message" x1="100" y1="544" x2="756" y2="544"/>

        <rect class="decision" x="590" y="576" width="340" height="72" rx="7"/>
        <text class="decision-title" x="760" y="601">
            8. Có yêu cầu xác minh email không?
        </text>
        <text class="decision-text" x="760" y="625">
            Verify Email hoặc Force Email Verification
        </text>

        <rect class="branch" x="70" y="680" width="1060" height="310" rx="7"/>
        <text class="branch-label" x="88" y="704">YÊU CẦU XÁC MINH</text>

        <rect class="step" x="590" y="724" width="340" height="60" rx="7"/>
        <text class="step-text" x="760" y="749">
            9a. Giữ email cũ, lưu email mới
        </text>
        <text class="step-text" x="760" y="770">ở trạng thái pending</text>

        <text class="message-label" x="920" y="820">10a. Gửi link xác minh</text>
        <line class="message" x1="760" y1="836" x2="1076" y2="836"/>

        <text class="message-label" x="430" y="872">11a. Bấm link xác minh</text>
        <line class="message" x1="100" y1="888" x2="756" y2="888"/>

        <rect class="step" x="590" y="916" width="340" height="56" rx="7"/>
        <text class="step-text" x="760" y="941">
            12a. Đổi email chính thức
        </text>
        <text class="step-text" x="760" y="960">và xóa trạng thái pending</text>

        <rect class="branch" x="570" y="1010" width="380" height="102" rx="7"/>
        <text class="branch-label" x="588" y="1034">KHÔNG YÊU CẦU XÁC MINH</text>
        <rect class="step" x="590" y="1048" width="340" height="48" rx="7"/>
        <text class="step-text" x="760" y="1077">
            9b. Đổi email ngay và reset Email Verified
        </text>

        <text class="message-label" x="565" y="1150">
            13. Redirect callback + authorization code
        </text>
        <line class="response" x1="760" y1="1166" x2="374" y2="1166"/>

        <text class="message-label" x="565" y="1208">
            14. keycloak-js đổi code + code_verifier lấy token mới
        </text>
        <line class="message" x1="370" y1="1224" x2="756" y2="1224"/>

        <text class="message-label" x="880" y="1266">
            15. Request API bằng access token mới
        </text>
        <line class="message" x1="370" y1="1282" x2="1386" y2="1282"/>

        <rect class="step" x="1240" y="1306" width="300" height="54" rx="7"/>
        <text class="step-text" x="1390" y="1330">
            16. Đồng bộ email mới
        </text>
        <text class="step-text" x="1390" y="1349">vào client DB</text>
    </g>
</svg>
